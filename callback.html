<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ragdoll_Keks — finishing sign-in…</title>
<style>
  body{ margin:0; min-height:100vh; display:grid; place-items:center;
    background:#FBFCFD; color:#1E2A32;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  @media (prefers-color-scheme: dark){ body{ background:#11171B; color:#E7EDF1; } }
  .box{ text-align:center; padding:2rem; max-width:420px; }
  h1{ font-size:1.25rem; margin:0 0 .5rem; }
  p{ color:#5A6B75; margin:.3rem 0; }
  @media (prefers-color-scheme: dark){ p{ color:#93A3AD; } }
  a{ color:#3F7699; }
</style>
</head>
<body>
  <div class="box">
    <h1>Finishing sign-in…</h1>
    <p>Handing the app your authorization. You can close this tab in a moment.</p>
    <p id="fallback" style="display:none">
      If nothing happens, <a id="link" href="#">click here</a> to continue.
    </p>
  </div>
  <script>
    // TikTok redirected here (https, which it requires). Bounce the OAuth code
    // back to the local app listening on localhost so it can finish sign-in.
    (function () {
      var qs = window.location.search || "";
      var target = "http://localhost:8723/callback" + qs;
      var link = document.getElementById("link");
      link.href = target;
      document.getElementById("fallback").style.display = "block";
      window.location.replace(target);
    })();
  </script>
</body>
</html>
